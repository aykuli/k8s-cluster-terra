apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloud-gateway
  namespace: aynur
spec:
  gatewayClassName: eg # Имя класса Envoy Gateway (создается при его установке в кластер)
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same # Разрешаем маршруты только из этого же namespace

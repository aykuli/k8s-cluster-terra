# NodePort — доступ с ноды: http://<node-ip>:<nodeport>
# Kubernetes автоматически назначит порт в диапазоне 30000-32767
# Узнать назначенный порт: kubectl get svc -n aynur
apiVersion: v1
kind: Service
metadata:
  name: aynapp-service
  namespace: aynur
spec:
  type: NodePort
  selector:
    aynur: diploma
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
---
# LoadBalancer — доступ по внешнему IP облачного балансировщика: http://<lb-ip>
# Если LoadBalancer недоступен, этот сервис будет в статусе Pending
apiVersion: v1
kind: Service
metadata:
  name: aynapp-lb
  namespace: aynur
spec:
  type: LoadBalancer
  selector:
    aynur: diploma
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
